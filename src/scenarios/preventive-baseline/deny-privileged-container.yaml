id: deny-privileged-container
version: 1
name: Privileged container denied
description: Attempts to create a pod running in privileged mode. The cluster should reject it.
category: preventive
controlObjective: Prevent privileged workloads
prerequisites:
  - name: can_create_pods
    description: Permission to create pods in the test namespace
  - name: admission_policy
    description: Admission policy that restricts privileged containers
manifest:
  apiVersion: v1
  kind: Pod
  metadata:
    name: chaosify-privileged-test
  spec:
    containers:
      - name: test
        image: busybox:1.36
        securityContext:
          privileged: true
expectedOutcome:
  type: admission_rejected
cleanup:
  deleteCreatedResources: true
safety:
  level: low
  namespaceScoped: true
