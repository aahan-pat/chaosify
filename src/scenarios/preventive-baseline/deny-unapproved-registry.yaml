id: deny-unapproved-registry
version: 1
name: Unapproved registry denied
description: Attempts to create a pod using an image from an unapproved registry. The cluster should reject it.
category: preventive
controlObjective: Restrict disallowed image registries
prerequisites:
  - name: can_create_pods
    description: Permission to create pods in the test namespace
  - name: registry_policy
    description: Admission policy that restricts image registries
manifest:
  apiVersion: v1
  kind: Pod
  metadata:
    name: chaosify-registry-test
  spec:
    containers:
      - name: test
        image: docker.io/unapproved-vendor/app:1.0.0
expectedOutcome:
  type: admission_rejected
cleanup:
  deleteCreatedResources: true
safety:
  level: low
  namespaceScoped: true
